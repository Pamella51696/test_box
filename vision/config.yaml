vision:
  enabled: true
  mode: overlay_only  # overlay_only | metric | both

  frame_source:
    type: java_frame_tap
    fallback: mjpeg
    mjpeg_url: "http://127.0.0.1:9091/stitch"

  middleware_url: "http://127.0.0.1:9091"

  model:
    backend: openvino
    onnx_path: "models/curb_segmentation.onnx"
    input_width: 896
    input_height: 512

  inference:
    target_hz: 8
    max_frame_age_ms: 2000
    confidence_threshold: 0.001

  output:
    coordinate_space: PANORAMA_PIXELS
    width: 2320
    height: 360

  server:
    host: "127.0.0.1"
    port: 8765

  calibration:
    profile: default  # default | synthetic-dev
    directory: "../config/calibration"
    allow_synthetic: false  # must be true (or VISION_ALLOW_SYNTHETIC=1) to publish metric from synthetic-dev
    coordinate_frame: rear_axle
    ground_plane_z_m: 0.0

  distance:
    method: ground_plane_projection
    definition: euclidean_ground_plane
    min_valid_distance_m: 0.05
    max_valid_distance_m: 5.0

  validation:
    min_detection_confidence: 0.60
    reject_invalid_projection: true
    max_detection_age_ms: 500

  ingest:
    enabled: true
    publish_hz: 10
    sensor_id_prefix: "VISION_"
    min_pano_strip_px: 40
